{% extends 'layouts/page.html' %}

{% block content %}
<h1>Find People</h1>

<form method="get" class="mb-6 flex gap-2">
    <input type="text" name="q" value="{{ query }}" placeholder="Search by username..." autocomplete="off">
    <button type="submit">Search</button>
</form>

<ul class="hoverlist">
    {% for user in results %}
    <li class="flex justify-between items-center">
        <a href="{% url 'profile' user.username %}" class="flex items-center gap-2">
            <img src="{{ user.avatar }}" class="w-8 h-8 rounded-full object-cover">
            @{{ user.username }}
        </a>
        <a href="{% url 'start-dm' user.username %}" class="button">Message</a>
    </li>
    {% empty %}
        {% if query %}
        <p>No users found for "{{ query }}".</p>
        {% endif %}
    {% endfor %}
</ul>
{% endblock %}
