{% extends 'layouts/page.html' %}

{% block content %}

<div class="text-center">
    <h1>{{ profile.name }}</h1>
    <div class="text-gray-400 mb-2 -mt-3">@{{ profile.username }}</div>
    {% if profile != request.user %}
    <a href="{% url 'start-dm' profile.username %}" class="button">Message</a>
    {% endif %}
    {% if profile.info %}
    <div class="mt-8">{{ profile.info|linebreaksbr }}</div>
    {% endif %}  
</div>

{% endblock %}
